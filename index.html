<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Court Club — Monthly Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --amber: #f5a623;
    --amber-dim: #a06c10;
    --green: #39ff14;
    --green-dim: #1a7a08;
    --red: #ff3b3b;
    --text: #e8e0d0;
    --text-dim: #888880;
    --text-muted: #444440;
    --rank1: #f5a623;
    --rank2: #c0c0c0;
    --rank3: #cd7f32;
    --mgp: 10;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCANLINE EFFECT */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--amber);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 0 40px rgba(245,166,35,0.15);
  }

  .logo {
    font-family: 'Oswald', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--amber);
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(245,166,35,0.5);
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.9rem;
    display: block;
    letter-spacing: 0.25em;
    margin-top: -4px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  /* MONTH SELECTOR */
  .month-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.05em;
  }

  .month-select:focus { border-color: var(--amber); }

  /* ADMIN BUTTON */
  .btn-admin {
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    padding: 0.45rem 1rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn-admin:hover {
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 12px rgba(245,166,35,0.2);
  }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* SECTION LABEL */
  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    padding-left: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* LEADERBOARD TABLE */
  .board {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 2.5rem;
  }

  .board thead tr {
    border-bottom: 1px solid var(--border);
  }

  .board th {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    padding: 0.6rem 1rem;
    text-align: left;
    font-weight: 400;
  }

  .board th.num { text-align: right; }

  .board tbody tr {
    border-bottom: 1px solid rgba(42,42,42,0.5);
    transition: background 0.15s;
    animation: rowIn 0.4s ease both;
  }

  .board tbody tr:hover { background: var(--surface2); }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .board td {
    padding: 0.9rem 1rem;
    font-size: 0.95rem;
  }

  .board td.num {
    text-align: right;
    font-family: 'Share Tech Mono', monospace;
  }

  /* RANK CELL */
  .rank-cell {
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    width: 3rem;
    color: var(--text-muted);
  }

  tr[data-rank="1"] .rank-cell { color: var(--rank1); text-shadow: 0 0 10px rgba(245,166,35,0.5); }
  tr[data-rank="2"] .rank-cell { color: var(--rank2); }
  tr[data-rank="3"] .rank-cell { color: var(--rank3); }

  /* PLAYER NAME */
  .player-name {
    font-family: 'Oswald', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* PPG CELL */
  .ppg-cell {
    font-family: 'Oswald', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--green);
    text-align: right;
    text-shadow: 0 0 8px rgba(57,255,20,0.3);
  }

  .in-progress-section .ppg-cell {
    color: var(--text-dim);
    text-shadow: none;
  }

  /* GAMES BAR */
  .games-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    justify-content: flex-end;
  }

  .games-bar {
    width: 60px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .games-bar-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .in-progress-section .games-bar-fill {
    background: var(--text-muted);
  }

  .games-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    min-width: 2.5rem;
    text-align: right;
  }

  /* IN PROGRESS SECTION */
  .in-progress-section {
    opacity: 0.7;
  }

  .in-progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 0.2rem 0.6rem;
    margin-left: 0.5rem;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 2.5rem;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stat-cell {
    background: var(--surface);
    padding: 1.2rem 1.5rem;
    text-align: center;
  }

  .stat-value {
    font-family: 'Oswald', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--amber);
    line-height: 1;
    display: block;
  }

  .stat-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 0.35rem;
    display: block;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    border: 1px dashed var(--border);
  }

  /* MODAL OVERLAY */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--amber);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 2rem;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    transform: translateY(12px);
    transition: transform 0.2s;
  }

  .overlay.open .modal { transform: translateY(0); }

  .modal-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.2rem;
  }

  .modal-close:hover { color: var(--text); }

  /* FORMS */
  .form-group {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.45rem;
  }

  input[type="text"],
  input[type="password"],
  input[type="number"],
  input[type="date"],
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    padding: 0.65rem 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus { border-color: var(--amber); }

  /* MATCH ENTRY GRID */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 80px;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    align-items: end;
  }

  .player-row-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }

  /* BUTTONS */
  .btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.7rem 1.5rem;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    width: 100%;
  }

  .btn-primary {
    background: var(--amber);
    color: #000;
    font-weight: 700;
  }

  .btn-primary:hover {
    background: #ffbb44;
    box-shadow: 0 0 20px rgba(245,166,35,0.4);
  }

  .btn-primary:disabled {
    background: var(--amber-dim);
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 0.75rem;
    padding: 0.4rem 0.75rem;
    width: auto;
  }

  .btn-danger:hover { background: rgba(255,59,59,0.1); }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
    gap: 0;
  }

  .tab {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.15s;
  }

  .tab.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
  }

  /* MATCH LOG */
  .match-log-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    font-size: 0.85rem;
  }

  .match-log-players {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    flex: 1;
  }

  .match-log-date {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    border: 1px solid var(--amber);
    color: var(--amber);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    padding: 0.75rem 1.5rem;
    z-index: 500;
    transition: transform 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(245,166,35,0.2);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 3rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* PLAYER MANAGEMENT */
  .player-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 0.35rem 0.75rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin: 0.25rem;
  }

  .player-tag button {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
  }

  .player-tag button:hover { color: var(--red); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.25rem 0;
  }

  /* SUPABASE CONFIG */
  .config-note {
    background: var(--surface2);
    border-left: 3px solid var(--amber);
    padding: 1rem;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 1.5rem;
    letter-spacing: 0.02em;
  }

  .config-note strong { color: var(--amber); }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .logo span { display: none; }
    .board th:nth-child(4),
    .board td:nth-child(4) { display: none; }
    .stats-bar { grid-template-columns: repeat(3,1fr); }
    .stat-value { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    Court Club
    <span>Monthly Standings</span>
  </div>
  <div class="header-right">
    <select class="month-select" id="monthSelect"></select>
    <button class="btn-admin" id="adminBtn">⚙ Admin</button>
  </div>
</header>

<main>
  <div id="appRoot"><div class="loading">LOADING STANDINGS...</div></div>
</main>

<!-- ADMIN LOGIN MODAL -->
<div class="overlay" id="loginOverlay">
  <div class="modal">
    <div class="modal-title">
      Admin Access
      <button class="modal-close" onclick="closeOverlay('loginOverlay')">✕</button>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" id="adminEmail" placeholder="admin@courtclub.com" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="Your Supabase password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="loginError" style="display:none;color:var(--red);font-family:Share Tech Mono,monospace;font-size:0.75rem;margin-bottom:1rem;letter-spacing:0.05em;"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ADMIN PANEL MODAL -->
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <div class="modal-title">
      Admin Panel
      <button class="modal-close" onclick="closeOverlay('adminOverlay')">✕</button>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('tabMatch', this)">Log Match</button>
      <button class="tab" onclick="switchTab('tabPlayers', this)">Players</button>
      <button class="tab" onclick="switchTab('tabLog', this)">History</button>
    </div>

    <!-- TAB: LOG MATCH -->
    <div id="tabMatch">
      <div class="form-group">
        <label>Match Date</label>
        <input type="date" id="matchDate">
      </div>

      <!-- TEAM A -->
      <div style="background:var(--surface2);border:1px solid var(--border);border-top:2px solid var(--amber);padding:1rem;margin-bottom:0.75rem;">
        <div style="font-family:'Share Tech Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;color:var(--amber);text-transform:uppercase;margin-bottom:0.75rem;">Team A</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.75rem;">
          <div>
            <div class="player-row-label">Player 1</div>
            <select id="ta_p1"><option value="">— Select —</option></select>
          </div>
          <div>
            <div class="player-row-label">Player 2</div>
            <select id="ta_p2"><option value="">— Select —</option></select>
          </div>
        </div>
        <div>
          <div class="player-row-label">Team A Score</div>
          <input type="number" id="ta_score" min="0" max="99" placeholder="e.g. 21" style="width:100%;">
        </div>
      </div>

      <!-- VS divider -->
      <div style="text-align:center;font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;letter-spacing:0.2em;color:var(--text-muted);margin:0.5rem 0;">VS</div>

      <!-- TEAM B -->
      <div style="background:var(--surface2);border:1px solid var(--border);border-top:2px solid #4a9eff;padding:1rem;margin-bottom:1.25rem;">
        <div style="font-family:'Share Tech Mono',monospace;font-size:0.65rem;letter-spacing:0.2em;color:#4a9eff;text-transform:uppercase;margin-bottom:0.75rem;">Team B</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.75rem;">
          <div>
            <div class="player-row-label">Player 1</div>
            <select id="tb_p1"><option value="">— Select —</option></select>
          </div>
          <div>
            <div class="player-row-label">Player 2</div>
            <select id="tb_p2"><option value="">— Select —</option></select>
          </div>
        </div>
        <div>
          <div class="player-row-label">Team B Score</div>
          <input type="number" id="tb_score" min="0" max="99" placeholder="e.g. 15" style="width:100%;">
        </div>
      </div>

      <button class="btn btn-primary" id="submitMatchBtn" onclick="submitMatch()">Log Match Result</button>
    </div>

    <!-- TAB: PLAYERS -->
    <div id="tabPlayers" style="display:none;">
      <div class="form-group">
        <label>Add Player</label>
        <div style="display:flex;gap:0.5rem;">
          <input type="text" id="newPlayerName" placeholder="Player name" style="flex:1;" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="btn btn-primary" style="width:auto;padding:0.65rem 1rem;" onclick="addPlayer()">Add</button>
        </div>
      </div>
      <div id="playerTagsList"></div>
    </div>

    <!-- TAB: HISTORY -->
    <div id="tabLog" style="display:none;">
      <div id="matchHistoryList"><div class="loading">LOADING...</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG — EDIT THESE VALUES
// ============================================================
const CONFIG = {
  supabaseUrl: 'https://jaghgbeaurkatqidvbbd.supabase.co',
  supabaseKey: 'sb_publishable_aZDKXRGF8MecJoItPStX_A_ZbstCTsz',
  mgpThreshold: 10,
};

/*
  ============================================================
  SUPABASE SQL SCHEMA (run in Supabase SQL Editor)
  ============================================================

  create table players (
    id uuid primary key default gen_random_uuid(),
    name text not null unique,
    created_at timestamptz default now()
  );

  create table matches (
    id uuid primary key default gen_random_uuid(),
    played_on date not null,
    created_at timestamptz default now()
  );

  create table match_entries (
    id uuid primary key default gen_random_uuid(),
    match_id uuid references matches(id) on delete cascade,
    player_id uuid references players(id) on delete cascade,
    points integer not null,
    created_at timestamptz default now()
  );

  -- Enable RLS and add permissive policies for anon reads:
  alter table players enable row level security;
  alter table matches enable row level security;
  alter table match_entries enable row level security;

  create policy "public read players" on players for select using (true);
  create policy "public read matches" on matches for select using (true);
  create policy "public read entries" on match_entries for select using (true);
  create policy "anon insert players" on players for insert with check (true);
  create policy "anon insert matches" on matches for insert with check (true);
  create policy "anon insert entries" on match_entries for insert with check (true);
  create policy "anon delete players" on players for delete using (true);
  create policy "anon delete matches" on matches for delete using (true);
  create policy "anon delete entries" on match_entries for delete using (true);

  ============================================================
*/

// ============================================================
// SUPABASE CLIENT
// ============================================================
const sb = {
  async query(path, opts = {}) {
    const token = state?.accessToken || CONFIG.supabaseKey;
    const res = await fetch(`${CONFIG.supabaseUrl}/rest/v1/${path}`, {
      headers: {
        'apikey': CONFIG.supabaseKey,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || 'return=representation',
        ...opts.headers
      },
      method: opts.method || 'GET',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  },

  async get(table, params = '') {
    return this.query(`${table}?${params}`);
  },

  async post(table, body) {
    return this.query(table, { method: 'POST', body });
  },

  async delete(table, params) {
    return this.query(`${table}?${params}`, { method: 'DELETE', prefer: '' });
  },

  async signIn(email, password) {
    const res = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': CONFIG.supabaseKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    return data;
  },

  async signOut(accessToken) {
    await fetch(`${CONFIG.supabaseUrl}/auth/v1/logout`, {
      method: 'POST',
      headers: {
        'apikey': CONFIG.supabaseKey,
        'Authorization': `Bearer ${accessToken}`
      }
    });
  }
};

// ============================================================
// STATE
// ============================================================
let state = {
  players: [],
  matches: [],
  entries: [],
  selectedMonth: '',
  isAdmin: false,
  accessToken: null,
};

// ============================================================
// INIT
// ============================================================
async function init() {
  populateMonthSelector();
  await loadData();
  renderLeaderboard();
}

function populateMonthSelector() {
  const sel = document.getElementById('monthSelect');
  const now = new Date();
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = label;
    sel.appendChild(opt);
  }
  state.selectedMonth = sel.value;
  sel.addEventListener('change', () => {
    state.selectedMonth = sel.value;
    renderLeaderboard();
  });
}

async function loadData() {
  try {
    const [players, matches, entries] = await Promise.all([
      sb.get('players', 'order=name'),
      sb.get('matches', 'order=played_on.desc'),
      sb.get('match_entries', 'select=*,player_id,match_id,points')
    ]);
    state.players = players;
    state.matches = matches;
    state.entries = entries;
    // Auto-seed Guest player if not present
    if (!players.find(p => p.name === 'Guest')) {
      await sb.post('players', { name: 'Guest' });
      const fresh = await sb.get('players', 'order=name');
      state.players = fresh;
    }
  } catch (e) {
    console.error(e);
    showToast('Connection error — check Supabase config', true);
  }
}

// ============================================================
// COMPUTE STANDINGS
// ============================================================
function computeStandings(month) {
  const [yr, mo] = month.split('-').map(Number);

  // Filter matches in selected month
  const monthMatches = state.matches.filter(m => {
    const d = new Date(m.played_on);
    return d.getFullYear() === yr && d.getMonth()+1 === mo;
  });

  const matchIds = new Set(monthMatches.map(m => m.id));

  // Aggregate per player — exclude Guest from leaderboard
  const stats = {};
  state.players.forEach(p => {
    if (p.name === 'Guest') return; // Guest excluded from standings
    stats[p.id] = { id: p.id, name: p.name, totalPoints: 0, games: 0 };
  });

  state.entries.forEach(e => {
    if (!matchIds.has(e.match_id)) return;
    if (!stats[e.player_id]) return; // Guest entries silently skipped
    stats[e.player_id].totalPoints += e.points;
    stats[e.player_id].games += 1;
  });

  const all = Object.values(stats).map(s => ({
    ...s,
    ppg: s.games > 0 ? s.totalPoints / s.games : 0
  }));

  const qualified = all
    .filter(s => s.games >= CONFIG.mgpThreshold)
    .sort((a, b) => b.ppg - a.ppg || b.games - a.games);

  const inProgress = all
    .filter(s => s.games < CONFIG.mgpThreshold)
    .sort((a, b) => b.ppg - a.ppg);

  return { qualified, inProgress, totalMatches: monthMatches.length };
}

// ============================================================
// RENDER LEADERBOARD
// ============================================================
function renderLeaderboard() {
  const { qualified, inProgress, totalMatches } = computeStandings(state.selectedMonth);
  const totalPlayers = state.players.length;
  const totalGames = qualified.reduce((s, p) => s + p.games, 0) +
                     inProgress.reduce((s, p) => s + p.games, 0);

  const root = document.getElementById('appRoot');

  // Stats bar
  const statsHtml = `
    <div class="stats-bar">
      <div class="stat-cell">
        <span class="stat-value">${totalMatches}</span>
        <span class="stat-label">Matches Played</span>
      </div>
      <div class="stat-cell">
        <span class="stat-value">${totalPlayers}</span>
        <span class="stat-label">Players</span>
      </div>
      <div class="stat-cell">
        <span class="stat-value">${CONFIG.mgpThreshold}</span>
        <span class="stat-label">Min Games (MGP)</span>
      </div>
    </div>
  `;

  // Qualified table
  let qualHtml = '';
  if (qualified.length === 0) {
    qualHtml = `<div class="empty-state">NO QUALIFIED PLAYERS THIS MONTH<br>— ${CONFIG.mgpThreshold} GAMES REQUIRED —</div>`;
  } else {
    qualHtml = `
      <table class="board">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th class="num">PPG</th>
            <th class="num">Games</th>
            <th class="num">Points</th>
          </tr>
        </thead>
        <tbody>
          ${qualified.map((p, i) => `
            <tr data-rank="${i+1}" style="animation-delay:${i*0.06}s">
              <td class="rank-cell">${i+1}</td>
              <td class="player-name">${escHtml(p.name)}</td>
              <td class="ppg-cell">${p.ppg.toFixed(2)}</td>
              <td class="num">
                <div class="games-bar-wrap">
                  <div class="games-bar">
                    <div class="games-bar-fill" style="width:${Math.min(p.games/CONFIG.mgpThreshold,1)*100}%"></div>
                  </div>
                  <span class="games-count">${p.games}</span>
                </div>
              </td>
              <td class="num" style="font-family:'Share Tech Mono',monospace;font-size:0.85rem;color:var(--text-dim)">${p.totalPoints}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // In progress table
  let ipHtml = '';
  if (inProgress.length > 0) {
    ipHtml = `
      <div class="in-progress-section">
        <div class="section-label">In Progress — fewer than ${CONFIG.mgpThreshold} games</div>
        <table class="board">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th class="num">PPG</th>
              <th class="num">Games</th>
              <th class="num">Points</th>
            </tr>
          </thead>
          <tbody>
            ${inProgress.map((p, i) => `
              <tr style="animation-delay:${(qualified.length+i)*0.06}s">
                <td class="rank-cell" style="color:var(--text-muted);font-size:1rem">—</td>
                <td class="player-name" style="color:var(--text-dim)">
                  ${escHtml(p.name)}
                  <span class="in-progress-label">${p.games}/${CONFIG.mgpThreshold}</span>
                </td>
                <td class="ppg-cell">${p.games > 0 ? p.ppg.toFixed(2) : '—'}</td>
                <td class="num">
                  <div class="games-bar-wrap">
                    <div class="games-bar">
                      <div class="games-bar-fill" style="width:${(p.games/CONFIG.mgpThreshold)*100}%"></div>
                    </div>
                    <span class="games-count">${p.games}</span>
                  </div>
                </td>
                <td class="num" style="font-family:'Share Tech Mono',monospace;font-size:0.85rem;color:var(--text-muted)">${p.totalPoints}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  root.innerHTML = `
    ${statsHtml}
    <div class="section-label">Official Rankings</div>
    ${qualHtml}
    ${ipHtml}
  `;
}

// ============================================================
// ADMIN AUTH
// ============================================================
document.getElementById('adminBtn').addEventListener('click', () => {
  if (state.isAdmin) {
    openAdminPanel();
  } else {
    openOverlay('loginOverlay');
    setTimeout(() => document.getElementById('adminEmail').focus(), 200);
  }
});

document.getElementById('adminBtn').addEventListener('contextmenu', async (e) => {
  if (!state.isAdmin) return;
  e.preventDefault();
  if (!confirm('Sign out of admin?')) return;
  try { await sb.signOut(state.accessToken); } catch(_) {}
  state.isAdmin = false;
  state.accessToken = null;
  document.getElementById('adminBtn').textContent = '⚙ Admin';
});

async function doLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pw = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!email || !pw) {
    errEl.textContent = 'Enter your email and password.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errEl.style.display = 'none';

  try {
    const data = await sb.signIn(email, pw);
    state.accessToken = data.access_token;
    state.isAdmin = true;
    closeOverlay('loginOverlay');
    document.getElementById('adminPassword').value = '';
    document.getElementById('adminEmail').value = '';
    document.getElementById('adminBtn').textContent = '⚙ Admin ●';
    openAdminPanel();
  } catch (e) {
    errEl.textContent = e.message || 'Login failed. Check your credentials.';
    errEl.style.display = 'block';
    document.getElementById('adminPassword').select();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

// ============================================================
// ADMIN PANEL
// ============================================================
function openAdminPanel() {
  openOverlay('adminOverlay');
  populateTeamSelects();
  renderPlayerTags();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('matchDate').value = today;
}

function populateTeamSelects() {
  const opts = '<option value="">— Select —</option>'
    + state.players.map(p =>
        `<option value="${p.id}">${escHtml(p.name)}</option>`
      ).join('');
  ['ta_p1','ta_p2','tb_p1','tb_p2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
}

function switchTab(tabId, el) {
  ['tabMatch','tabPlayers','tabLog'].forEach(t => {
    document.getElementById(t).style.display = t === tabId ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (tabId === 'tabLog') renderMatchHistory();
}

// SUBMIT MATCH (doubles: Team A vs Team B, each player gets their team score)
async function submitMatch() {
  const date = document.getElementById('matchDate').value;
  if (!date) { showToast('Please select a date', true); return; }

  const ta_p1 = document.getElementById('ta_p1').value;
  const ta_p2 = document.getElementById('ta_p2').value;
  const ta_score = document.getElementById('ta_score').value;
  const tb_p1 = document.getElementById('tb_p1').value;
  const tb_p2 = document.getElementById('tb_p2').value;
  const tb_score = document.getElementById('tb_score').value;

  // Validation
  const teamA = [ta_p1, ta_p2].filter(Boolean);
  const teamB = [tb_p1, tb_p2].filter(Boolean);

  if (teamA.length < 1 || teamB.length < 1) {
    showToast('Select at least 1 player per team', true); return;
  }
  if (ta_score === '' || tb_score === '') {
    showToast('Enter scores for both teams', true); return;
  }

  const allSelected = [...teamA, ...teamB];
  const uniquePlayers = new Set(allSelected);
  if (uniquePlayers.size !== allSelected.length) {
    showToast('Same player selected twice', true); return;
  }

  const scoreA = parseInt(ta_score);
  const scoreB = parseInt(tb_score);

  // Build entries — each player gets their team's score
  // Guest players (name === 'Guest') are included in DB for history but flagged
  const entries = [
    ...teamA.map(pid => ({ player_id: pid, points: scoreA })),
    ...teamB.map(pid => ({ player_id: pid, points: scoreB }))
  ];

  const btn = document.getElementById('submitMatchBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const [match] = await sb.post('matches', { played_on: date });
    await sb.post('match_entries', entries.map(e => ({ ...e, match_id: match.id })));
    await loadData();
    renderLeaderboard();
    // Reset selects
    ['ta_p1','ta_p2','tb_p1','tb_p2'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('ta_score').value = '';
    document.getElementById('tb_score').value = '';
    showToast('Match logged successfully');
  } catch (e) {
    showToast('Error saving match', true);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Log Match Result';
  }
}

// PLAYER MANAGEMENT
function renderPlayerTags() {
  const el = document.getElementById('playerTagsList');
  if (state.players.length === 0) {
    el.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;font-family:Share Tech Mono,monospace;">No players added yet.</p>';
    return;
  }
  el.innerHTML = state.players.map(p => {
    const isGuest = p.name === 'Guest';
    return `
      <span class="player-tag" style="${isGuest ? 'border-color:var(--amber-dim);' : ''}">
        ${escHtml(p.name)}
        ${isGuest
          ? '<span style="font-size:0.6rem;color:var(--amber-dim);letter-spacing:0.1em;">GUEST</span>'
          : `<button onclick="deletePlayer('${p.id}', '${escHtml(p.name)}')" title="Remove">✕</button>`
        }
      </span>
    `;
  }).join('');
}

async function addPlayer() {
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if (!name) return;
  if (state.players.find(p => p.name.toLowerCase() === name.toLowerCase())) {
    showToast('Player already exists', true); return;
  }
  try {
    await sb.post('players', { name });
    await loadData();
    renderPlayerTags();
    populateTeamSelects();
    renderLeaderboard();
    input.value = '';
    showToast(`${name} added`);
  } catch (e) {
    showToast('Error adding player', true);
  }
}

async function deletePlayer(id, name) {
  if (!confirm(`Remove ${name}? This will not delete their match history.`)) return;
  try {
    await sb.delete('players', `id=eq.${id}`);
    await loadData();
    renderPlayerTags();
    renderPlayerRows();
    renderLeaderboard();
    showToast(`${name} removed`);
  } catch (e) {
    showToast('Error removing player', true);
  }
}

// MATCH HISTORY
async function renderMatchHistory() {
  const el = document.getElementById('matchHistoryList');
  el.innerHTML = '<div class="loading">LOADING...</div>';

  const recentMatches = [...state.matches].slice(0, 30);
  if (recentMatches.length === 0) {
    el.innerHTML = '<div class="empty-state">NO MATCHES LOGGED YET</div>';
    return;
  }

  const playerMap = Object.fromEntries(state.players.map(p => [p.id, p.name]));

  el.innerHTML = recentMatches.map(m => {
    const matchEntries = state.entries.filter(e => e.match_id === m.id);
    const playerList = matchEntries
      .sort((a, b) => b.points - a.points)
      .map(e => `${playerMap[e.player_id] || '?'} (${e.points})`)
      .join(' · ');

    return `
      <div class="match-log-item">
        <div>
          <div class="match-log-players">${playerList || 'No entries'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span class="match-log-date">${m.played_on}</span>
          <button class="btn btn-danger" onclick="deleteMatch('${m.id}')">✕</button>
        </div>
      </div>
    `;
  }).join('');
}

async function deleteMatch(id) {
  if (!confirm('Delete this match? This cannot be undone.')) return;
  try {
    await sb.delete('match_entries', `match_id=eq.${id}`);
    await sb.delete('matches', `id=eq.${id}`);
    await loadData();
    renderLeaderboard();
    renderMatchHistory();
    showToast('Match deleted');
  } catch (e) {
    showToast('Error deleting match', true);
  }
}

// ============================================================
// HELPERS
// ============================================================
function openOverlay(id) {
  document.getElementById(id).classList.add('open');
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
}

// Close on backdrop click
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) closeOverlay(o.id);
  });
});

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ============================================================
// START
// ============================================================
init();
</script>
